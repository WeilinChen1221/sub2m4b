[project]
name = "sub2m4b"
version = "0.1.0"
description = "Turn subtitled anime into chaptered Japanese listening audiobooks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "pysubs2>=1.8,<2"]

[project.scripts]
sub2m4b = "sub2m4b.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
